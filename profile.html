<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thông tin cá nhân | TOEIC Mastery</title>
    <link rel="stylesheet" href="/src/input.css" />
    <script>
      (function () {
        const saved = localStorage.getItem("theme");
        const dark = saved
          ? saved === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;

        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body class="font-body bg-surface text-ink">
    <div id="nav-sentinel" aria-hidden="true"></div>
    <header class="w-full bg-brand-700 text-white">
      <nav class="mx-auto flex h-[72px] max-w-[1366px] items-center justify-between px-6 lg:px-[50px]">
        <a href="./index.html" class="text-xl font-bold">TOEIC Mastery</a>
        <div class="hidden items-center gap-7 lg:flex">
          <a href="./index.html">Home</a>
          <a href="./index.html#courses">Courses</a>
          <a href="./index.html#features">Why us</a>
          <a href="./pricing.html">Pricing</a>
          <a href="./index.html#faq">FAQ</a>
          <a href="./contact.html">Contact</a>
        </div>
        <div class="flex items-center gap-3">
          <div data-auth-guest class="flex items-center gap-3">
            <a href="./login.html" class="rounded-card bg-white px-4 py-2 text-sm font-semibold text-brand-700 hover:bg-brand-50">Login</a>
            <a href="./register.html" class="hidden rounded-card border border-white/70 px-4 py-2 text-sm font-semibold text-white hover:bg-white/10 sm:inline-flex">Sign up</a>
          </div>
          <div data-auth-user class="hidden flex items-center gap-3">
            <a href="./profile.html" aria-current="page" class="font-semibold text-white underline" data-auth-user-name></a>
            <button type="button" data-auth-logout class="rounded-card bg-white px-4 py-2 text-sm font-semibold text-brand-700 hover:bg-brand-50">Log out</button>
          </div>
          <button
            id="menu-toggle"
            type="button"
            class="text-2xl text-white lg:hidden"
            aria-expanded="false"
            aria-controls="mobile-menu"
            aria-label="Mở menu"
          >
            ☰
          </button>
          <button
            type="button"
            data-theme-toggle
            class="flex h-10 w-10 items-center justify-center rounded-full border border-white/70 bg-white text-brand-700 hover:bg-brand-50 focus:outline-none focus:ring-2 focus:ring-white"
            aria-label="Chuyển sang chế độ tối"
            aria-pressed="false"
          >
            ◐
          </button>
        </div>
      </nav>
      <div id="mobile-menu" class="hidden border-t border-white/20 bg-brand-700 text-white lg:hidden">
        <nav class="flex flex-col gap-4 px-6 py-5" aria-label="Menu mobile">
          <a href="./index.html">Home</a>
          <a href="./index.html#courses">Courses</a>
          <a href="./index.html#features">Why us</a>
          <a href="./pricing.html">Pricing</a>
          <a href="./index.html#faq">FAQ</a>
          <a href="./contact.html">Contact</a>
          <div data-auth-guest class="flex flex-col items-start gap-4">
            <a href="./login.html" class="w-fit rounded-card bg-white px-4 py-2 text-sm font-semibold text-brand-700">Login</a>
            <a href="./register.html" class="w-fit rounded-card border border-white/70 px-4 py-2 text-sm font-semibold text-white hover:bg-white/10">Sign up</a>
          </div>
          <div data-auth-user class="hidden flex flex-col items-start gap-4">
            <a href="./profile.html" aria-current="page" class="font-semibold text-white underline" data-auth-user-name></a>
            <button type="button" data-auth-logout class="w-fit rounded-card bg-white px-4 py-2 text-sm font-semibold text-brand-700">Log out</button>
          </div>
        </nav>
      </div>
    </header>

    <main class="section">
      <section class="card mx-auto max-w-xl p-8 sm:p-10">
        <h1 class="mb-8 text-center text-2xl font-bold">Thông tin cá nhân</h1>
        <dl class="space-y-6">
          <div>
            <dt class="field-label">Tên đăng nhập</dt>
            <dd class="text-ink" data-profile-name></dd>
          </div>
          <div>
            <dt class="field-label">Email</dt>
            <dd class="text-ink" data-profile-email></dd>
          </div>
        </dl>
        <p id="profile-message" class="mt-6 text-sm" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
