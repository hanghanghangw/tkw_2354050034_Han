<!doctype html>
<html lang="en"  >
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TOEIC Mastery</title>
    <script>
    (function () {
      const saved = localStorage.getItem("theme");

      const dark = saved
        ? saved === "dark"
        : window.matchMedia("(prefers-color-scheme: dark)").matches;

      document.documentElement.classList.toggle("dark", dark);
    })();
  </script>
    <link rel="stylesheet" href="/src/input.css" />
    
  </head>

  <body
    class="min-h-screen bg-surface text-ink"
  >
    <!-- ================= NAV SENTINEL ================= -->
    <div
      id="nav-sentinel"
      aria-hidden="true"
    ></div>

    <!-- ================= HEADER ================= -->
    <header
      class="w-full border-b border-white/20 bg-brand-700 text-white"
    >
      <nav
        class="max-w-[1366px] mx-auto px-6 lg:px-12 h-[72px] flex items-center justify-between"
        aria-label="Điều hướng chính"
      >
        <!-- Logo -->
        <a
          href="./index.html"
          class="font-display font-bold text-xl text-white"
        >
          TOEIC Mastery
        </a>

        <!-- Desktop menu -->
        <div
          class="hidden lg:flex items-center gap-8 text-sm font-medium"
        >
          <a
            href="./index.html"
            class="text-white hover:text-white/80"
          >
              Home
          </a>

          <a
            href="./pricing.html"
            class="text-white hover:text-white/80"
          >
            Bảng giá
          </a>

          <a
            href="./records.html"
            class="text-white underline"
            aria-current="page"
          >
            Học viên
          </a>

          <a
            href="./contact.html"
            class="text-white hover:text-white/80"
          >
            Liên hệ
          </a>
        </div>

        <!-- Actions -->
        <div class="flex items-center gap-3">
          <div data-auth-guest class="flex items-center gap-3">
            <a
              href="./login.html"
              class="rounded-card bg-white px-3 py-2 text-sm font-semibold text-brand-700 transition hover:bg-brand-50"
            >
              Login
            </a>
            <a
              href="./register.html"
              class="hidden rounded-card border border-white/70 px-4 py-2 text-sm font-semibold text-white transition hover:bg-white/10 sm:inline-flex"
            >
              Sign up
            </a>
          </div>
          <div data-auth-user class="hidden flex items-center gap-3">
            <a href="./profile.html" class="font-semibold text-white hover:underline" data-auth-user-name></a>
            <button type="button" data-auth-logout class="rounded-card bg-white px-3 py-2 text-sm font-semibold text-brand-700 hover:bg-brand-50">Log out</button>
          </div>
          <!-- Theme -->
          <button
            type="button"
            data-theme-toggle
            class="flex h-10 w-10 items-center justify-center rounded-full border border-white/70 bg-white text-brand-700 hover:bg-brand-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-white"
            aria-label="Chuyển sang chế độ tối"
            aria-pressed="false"
          >
            ◐
          </button>

          <!-- Mobile menu -->
          <button
            id="menu-toggle"
            type="button"
            class="text-2xl text-white lg:hidden"
            aria-expanded="false"
            aria-controls="mobile-menu"
            aria-label="Mở menu"
          >
            ☰
          </button>
        </div>
      </nav>

      <!-- Mobile menu -->
      <div
        id="mobile-menu"
        class="hidden border-t border-white/20 bg-brand-700 text-white lg:hidden"
      >
        <nav
          class="flex flex-col gap-4 px-6 py-5 text-sm font-medium"
          aria-label="Menu mobile"
        >
          <a
            href="./index.html"
            class="text-white hover:text-white/80"
          >
            Home
          </a>

          <a
            href="./pricing.html"
            class="text-white hover:text-white/80"
          >
            Bảng giá
          </a>

          <a
            href="./records.html"
            class="text-white underline"
            aria-current="page"
          >
            Học viên
          </a>

          <a
            href="./contact.html"
            class="text-white hover:text-white/80"
          >
            Liên hệ
          </a>
          <div data-auth-guest class="flex flex-col items-start gap-4">
            <a href="./login.html" class="w-fit rounded-card bg-white px-4 py-2 text-sm font-semibold text-brand-700">Login</a>
            <a href="./register.html" class="w-fit rounded-card border border-white/70 px-4 py-2 text-sm font-semibold text-white hover:bg-white/10">Sign up</a>
          </div>
          <div data-auth-user class="hidden flex flex-col items-start gap-4">
            <a href="./profile.html" class="font-semibold text-white hover:underline" data-auth-user-name></a>
            <button type="button" data-auth-logout class="w-fit rounded-card bg-white px-4 py-2 text-sm font-semibold text-brand-700">Log out</button>
          </div>
        </nav>
      </div>
    </header>

    <!-- ================= MAIN ================= -->
    <main>
        
      <section
        class="section"
        aria-labelledby="records-title"
      >
        <!-- Heading -->
        <div
          class="mx-auto mb-10 max-w-3xl text-center"
        >
          <span
            class="text-xs font-semibold uppercase tracking-wider text-brand-600"
          >
            STUDENT DATA
          </span>

          <h1
            id="records-title"
            class="mt-2 font-display text-3xl font-bold text-ink md:text-4xl"
          >
            Danh sách học viên
          </h1>

          <p
            class="mt-3 text-sm text-muted md:text-base"
          >
            Theo dõi thông tin đăng ký khóa học tại TOEIC Mastery.
          </p>
        </div>

<div
  class="mb-6 grid gap-4 md:grid-cols-3"
>
  <!-- Search -->
  <div>
    <label
      for="record-search"
      class="field-label"
    >
      Tìm học viên
    </label>

    <input
      id="record-search"
      type="search"
      class="field-input"
      placeholder="Nhập tên học viên..."
    />
  </div>

  <!-- Course -->
  <div>
    <label
      for="course-filter"
      class="field-label"
    >
      Khóa học
    </label>

    <select
      id="course-filter"
      class="field-input"
    >
      <option value="all">
        Tất cả khóa học
      </option>

      <option value="TOEIC Foundation">
        TOEIC Foundation
      </option>

      <option value="TOEIC Intensive">
        TOEIC Intensive
      </option>
    </select>
  </div>

  <!-- Sort -->
  <div>
    <label
      for="record-sort"
      class="field-label"
    >
      Sắp xếp
    </label>

    <select
      id="record-sort"
      class="field-input"
    >
      <option value="date-desc">
        Mới nhất
      </option>

      <option value="score-desc">
        Điểm cao nhất
      </option>

      <option value="amount-desc">
        Học phí cao nhất
      </option>
    </select>
  </div>
</div>

        <!-- ================= LOADING ================= -->
        <div
          id="records-loading"
          class="card text-center text-muted"
          role="status"
        >
          Đang tải dữ liệu...
        </div>

        <!-- ================= ERROR ================= -->
        <div
          id="records-error"
          class="hidden card text-center text-red-600"
          role="alert"
        ></div>

        <!-- ================= EMPTY ================= -->
        <div
          id="records-empty"
          class="hidden card text-center text-muted"
        >
          Không có dữ liệu phù hợp.
        </div>

        <!-- ================= DATA ================= -->
        <div
          id="records-content"
          class="hidden overflow-x-auto rounded-card border border-line shadow-sm"
        >
          <table
            class="w-full min-w-[900px] text-left text-sm"
          >
            <thead
              class="bg-surface-alt text-ink"
            >
              <tr>
                <th
                  scope="col"
                  class="p-4 font-semibold"
                >
                  Mã
                </th>

                <th
                  scope="col"
                  class="p-4 font-semibold"
                >
                  Học viên
                </th>

                <th
                  scope="col"
                  class="p-4 font-semibold"
                >
                  Khóa học
                </th>

                <th
                  scope="col"
                  class="p-4 font-semibold"
                >
                  Trạng thái
                </th>

                <th
                  scope="col"
                  class="p-4 font-semibold"
                >
                  Điểm
                </th>

                <th
                  scope="col"
                  class="p-4 font-semibold"
                >
                  Học phí
                </th>

                <th
                  scope="col"
                  class="p-4 font-semibold"
                >
                  Ngày đăng ký
                </th>
              </tr>
            </thead>

            <tbody
              id="records-body"
              class="divide-y divide-line bg-surface"
            ></tbody>
          </table>
        </div>
  

        
        <!-- ================= TEMPLATE ================= -->
        <!-- Template không hiển thị trực tiếp -->
        <template id="record-template">
          <tr
            class="transition hover:bg-surface-alt"
          >
            <td
              data-cell="id"
              class="p-4 font-medium text-ink"
            ></td>

            <td
              data-cell="student"
              class="p-4 font-medium text-ink"
            ></td>

            <td
              data-cell="course"
              class="p-4 text-muted"
            ></td>

            <td
              data-cell="status"
              class="p-4 text-muted"
            ></td>

            <td
              data-cell="score"
              class="p-4 text-muted"
            ></td>

            <td
              data-cell="amount"
              class="p-4 text-muted"
            ></td>

            <td
              data-cell="date"
              class="p-4 text-muted"
            ></td>
          </tr>
        </template>
      </section>
    </main>

    <!-- ================= TO TOP ================= -->
    <button
      id="to-top"
      type="button"
      class="hidden fixed bottom-6 right-6 h-11 w-11 rounded-full bg-brand-600 text-white shadow-lg flex items-center justify-center focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-600 focus-visible:ring-offset-2"
      aria-label="Lên đầu trang"
      aria-hidden="true"
    >
      ↑
    </button>

    <!-- ================= JS ================= -->
    <script
      type="module"
      src="./js/main.js"
    ></script>
  </body>
</html>
