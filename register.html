<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký | TOEIC Mastery</title>
    <link rel="stylesheet" href="/src/input.css" />
    <script>
      (function () {
        const saved = localStorage.getItem("theme");
        const dark = saved
          ? saved === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;

        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body class="font-body bg-surface text-ink">
    <div id="nav-sentinel" aria-hidden="true"></div>
    <header class="w-full bg-brand-700 text-white">
      <nav class="mx-auto flex h-[72px] max-w-[1366px] items-center justify-between px-6 lg:px-[50px]">
        <a href="./index.html" class="text-xl font-bold">TOEIC Mastery</a>
        <div class="hidden items-center gap-7 lg:flex">
          <a href="./index.html">Home</a>
          <a href="./index.html#courses">Courses</a>
          <a href="./index.html#features">Why us</a>
          <a href="./pricing.html">Pricing</a>
          <a href="./index.html#faq">FAQ</a>
          <a href="./contact.html">Contact</a>
        </div>
        <div class="flex items-center gap-3">
          <div data-auth-guest class="flex items-center gap-3">
            <a href="./login.html" class="rounded-card bg-white px-3 py-2 text-sm font-semibold text-brand-700 transition hover:bg-brand-50 sm:px-4">Login</a>
            <a href="./register.html" aria-current="page" class="hidden rounded-card border border-white/70 px-3 py-2 text-sm font-semibold text-white transition hover:bg-white/10 sm:inline-flex sm:px-4">Sign up</a>
          </div>
          <div data-auth-user class="hidden flex items-center gap-3">
            <a href="./profile.html" class="font-semibold text-white hover:underline" data-auth-user-name></a>
            <button type="button" data-auth-logout class="rounded-card bg-white px-3 py-2 text-sm font-semibold text-brand-700 sm:px-4">Log out</button>
          </div>
          <button
            id="menu-toggle"
            type="button"
            class="text-2xl text-white lg:hidden"
            aria-expanded="false"
            aria-controls="mobile-menu"
            aria-label="Mở menu"
          >
            ☰
          </button>
          <button
            type="button"
            data-theme-toggle
            class="flex h-10 w-10 items-center justify-center rounded-full border border-white/70 bg-white text-brand-700 hover:bg-brand-50 focus:outline-none focus:ring-2 focus:ring-white"
            aria-label="Chuyển sang chế độ tối"
            aria-pressed="false"
          >
            ◐
          </button>
        </div>
      </nav>
      <div id="mobile-menu" class="hidden border-t border-white/20 bg-brand-700 text-white lg:hidden">
        <nav class="flex flex-col gap-4 px-6 py-5" aria-label="Menu mobile">
          <a href="./index.html">Home</a>
          <a href="./index.html#courses">Courses</a>
          <a href="./index.html#features">Why us</a>
          <a href="./pricing.html">Pricing</a>
          <a href="./index.html#faq">FAQ</a>
          <a href="./contact.html">Contact</a>
          <div data-auth-guest class="flex flex-col items-start gap-4">
            <a href="./login.html" class="w-fit rounded-card bg-white px-4 py-2 text-sm font-semibold text-brand-700">Login</a>
            <a href="./register.html" aria-current="page" class="w-fit rounded-card border border-white/70 px-4 py-2 text-sm font-semibold text-white hover:bg-white/10">Sign up</a>
          </div>
          <div data-auth-user class="hidden flex flex-col items-start gap-4">
            <a href="./profile.html" class="font-semibold text-white hover:underline" data-auth-user-name></a>
            <button type="button" data-auth-logout class="w-fit rounded-card bg-white px-4 py-2 text-sm font-semibold text-brand-700">Log out</button>
          </div>
        </nav>
      </div>
    </header>

    <main class="flex min-h-[calc(100vh-72px)] items-center justify-center px-5 py-12">
      <section class="card w-full max-w-md p-8 sm:p-10">
        <h1 class="mb-8 text-center text-2xl font-bold">Tạo tài khoản</h1>
        <form id="register-form">
          <div class="mb-5">
            <label class="field-label" for="username">Tên đăng nhập</label>
            <input
              class="field-input"
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              required
            />
          </div>
          <div class="mb-5">
            <label class="field-label" for="email">Email</label>
            <input
              class="field-input"
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
            />
          </div>
          <div class="mb-5">
            <label class="field-label" for="password">Mật khẩu</label>
            <input
              class="field-input"
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              minlength="8"
              required
            />
          </div>
          <div class="mb-6">
            <label class="field-label" for="confirm-password">Nhập lại mật khẩu</label>
            <input
              class="field-input"
              id="confirm-password"
              name="confirmPassword"
              type="password"
              autocomplete="new-password"
              minlength="8"
              required
            />
          </div>
          <button class="btn btn-primary w-full" type="submit">Đăng ký</button>
          <p id="auth-message" class="mt-4 text-sm" role="status" aria-live="polite"></p>
        </form>
        <p class="mt-6 text-center text-sm text-muted">
          Đã có tài khoản?
          <a href="./login.html" class="font-semibold text-brand-600 hover:underline">Đăng nhập</a>
        </p>
      </section>
    </main>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
